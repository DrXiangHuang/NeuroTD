[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurotd"
version = "1.0.1"
description = "NeuroTD: Adaptive sliding-window inference of time-varying neural delays"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "scikit-image",
    "tslearn",
    "dtw-python",
    "tqdm",
    "xxhash",
    "pynwb",
    "statsmodels",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
